# pre-crs: loaded before CRS.
# Engine/audit settings, runtime exclusions (ctl), local detection rules.
#
# Local detection rules: use IDs 190000-199999 with a msg to have them
# reported in rules_hit and rule_ids; otherwise use IDs 1-99999.
#
# Runtime exclusions: no msg, it would count in rules_hit.
#
# Use the right phase:
# - runtime exclusions (ctl) / condition on request-line, headers, IP:
#       phase 1; can exclude rules of any phase
# - runtime exclusions (ctl) / condition on body, eg: ARGS_POST:
#       phase 2; can only exclude rules of phase 2 and later
# - local rules / direct deny: any phase
# - local rules / anomaly scoring: phase 2 (request) or 4 (response) only

SecRuleEngine On

# SecDefaultAction on all phases is now provided by crs-setup.conf
# since CRS 4.25.1 and 4.28.0, otherwise only for phase 1 and 2.
# Required to (audit)log all traffic.
#SecDefaultAction "phase:3,log,auditlog,pass"
#SecDefaultAction "phase:4,log,auditlog,pass"
#SecDefaultAction "phase:5,log,auditlog,pass"

#SecAuditEngine On
SecAuditEngine RelevantOnly
SecAuditLogParts ABCEFHIJKZ
SecAuditLogFormat JSON
SecAuditLogType Serial
SecAuditLog /var/log/coraza-spoa/audit-default.log

#SecRule REQUEST_HEADERS:Host "@streq www.domain.com" \
#    "id:10001,\
#    phase:1,\
#    pass,\
#    t:none,t:lowercase,\
#    nolog,\
#    ctl:ruleRemoveById=950130,\
#    ctl:ruleRemoveByTag=language-php"

SecRule REQUEST_FILENAME "@rx (?:^|/)(?:pma|admin|dbadmin|php-my-admin|phpmyadmin|php-myadmin|phpmy-admin|phpadmin|mysql|sqlweb|websql|sqlmanager|manager)(?:/|$)" \
    "id:196500,\
    phase:1,\
    deny,\
    status:403,\
    t:none,t:lowercase,\
    log,\
    auditlog,\
    msg:'Request Indicates a Security Scanner Scanned the Site',\
    severity:'CRITICAL'"
