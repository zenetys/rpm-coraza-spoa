# post-crs: loaded after CRS.
# Configure-time exclusions acting on the compiled ruleset, ie:
# SecRuleRemove*, SecRuleUpdate*. They have no ID and apply to ALL
# requests. 

# Remove a rule by ID
#SecRuleRemoveById 950130

# Remove every rule carrying a tag
#SecRuleRemoveByTag "platform-windows"

# Keep a rule but stop inspecting one variable
#SecRuleUpdateTargetById 942100 "!ARGS:password"
